name: Kindred
description: Kindred is a members-only home exchange platform where verified members swap their
  real homes with one another instead of paying for traditional accommodation. The service runs on
  a credit economy — members earn one night of travel credit for every night they host, and new members
  start with five nights of credit. Kindred verifies every member and home, provides professional
  cleaning before and after each stay, and includes up to $100K in damage protection. There are no
  membership fees; travelers pay only a cleaning and service fee per trip. The platform operates across
  190+ cities in North America and Europe and is backed by a16z, Bessemer Venture Partners, GV, Index
  Ventures, and NEA. Kindred is a consumer travel product and does not publish a public API, developer
  portal, or technical documentation.
